<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pokemon DraftZone</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        var theme = 'classic',
          ldMode = 'device';
        try {
          var stored = JSON.parse(localStorage.getItem('user-settings')) || {};
          if (stored.themeOverride !== '6526' && stored.theme != null)
            theme = stored.theme;
          if (stored.ldMode) ldMode = stored.ldMode;
        } catch (e) {}
        var isDark =
          ldMode === 'dark' ||
          (ldMode !== 'light' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.setAttribute('pdz-theme', theme);
        root.setAttribute('pdz-theme-mode', isDark ? 'dark' : 'light');
        root.classList.add(isDark ? 'dark' : 'light');
      })();
    </script>
    <link
      rel="preload"
      href="/assets/fonts/nasalization-pd.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link rel="icon" type="image/x-icon" href="./assets/favicon.ico" />
    <!-- Pokemon Draftzone logo and images created by @Mr.Twang -->
    <meta name="title" content="Pokemon DraftZone" />
    <meta name="description" content="The ultimate Pokemon draft resource!" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pokemondraftzone.com/" />
    <meta property="og:title" content="Pokemon DraftZone" />
    <meta
      property="og:description"
      content="The ultimate Pokemon draft resource!"
    />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="http://pokemondraftzone.com/" />
    <meta property="twitter:title" content="Pokemon DraftZone" />
    <meta
      property="twitter:description"
      content="The ultimate Pokemon draft resource!"
    />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <pdz-root></pdz-root>
    <noscript
      >Please enable JavaScript to continue using this application.</noscript
    >
  </body>
</html>
