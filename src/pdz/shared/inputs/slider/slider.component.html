<div
  class="slider"
  [class.slider--disabled]="isDisabled()"
  [style.--pdz-slider-fill]="fillPercent + '%'"
  [style.--pdz-slider-active]="color() || null"
>
  @if (showValue()) {
    <div class="slider__bubble" aria-hidden="true">{{ value }}</div>
  }
  @if (tickMarks().length > 0) {
    <div class="slider__ticks" aria-hidden="true">
      @for (tick of tickMarks(); track $index) {
        <span
          class="slider__tick"
          [attr.data-tone]="tick.tone"
          [class.slider__tick--filled]="tick.position <= fillPercent"
          [style.left.%]="tick.position"
        ></span>
      }
    </div>
  }
  <input
    class="slider__input"
    type="range"
    [min]="min()"
    [max]="max()"
    [step]="effectiveStep()"
    [disabled]="isDisabled()"
    [value]="value"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />
</div>
