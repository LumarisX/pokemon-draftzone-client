<div
  class="pdz-slide-toggle"
  [class.checked]="checkedState"
  [class.disabled]="disabled()"
  (click)="toggle()"
>
  <span class="toggle-track">
    <span class="toggle-thumb">
      <pdz-icon class="toggle-icon" [name]="iconName" [size]="18"></pdz-icon>
    </span>
  </span>
  <ng-content></ng-content>
</div>
