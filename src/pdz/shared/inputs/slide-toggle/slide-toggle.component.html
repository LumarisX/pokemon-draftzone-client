<div
  class="pdz-slide-toggle"
  [class.checked]="checkedState"
  [class.disabled]="disabled()"
  (click)="toggle()"
>
  <span class="toggle-track">
    <span class="toggle-thumb">
      @if (checkedState) {
        @if (onSVG()) {
          <pdz-icon class="toggle-icon" [name]="onSVG()!"></pdz-icon>
        } @else {
          <pdz-icon class="toggle-icon" [name]="offIcon()"></pdz-icon>
        }
      } @else {
        @if (offSVG()) {
          <pdz-icon class="toggle-icon" [name]="offSVG()!"></pdz-icon>
        } @else {
          <pdz-icon class="toggle-icon" [name]="offIcon()"></pdz-icon>
        }
      }
    </span>
  </span>
  <ng-content></ng-content>
</div>
