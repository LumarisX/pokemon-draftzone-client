<form
  [class]="'form-container ' + class()"
  cdkOverlayOrigin
  #trigger="cdkOverlayOrigin"
  #pokemonForm
>
  <label pdz-field label="{{ label() }}" class="pokemon-select__field">
    @if (showSprite() !== null && setPokemon) {
      <div matPrefix class="selected-sprite">
        <pdz-sprite flipped [pokemon]="setPokemon"></pdz-sprite>
      </div>
    }
    <input
      type="text"
      spellcheck="false"
      pdz-input
      (focus)="setOpen(true)"
      (input)="setOpen(true)"
      (blur)="onBlur()"
      [formControl]="selectedForm"
    />
    @if (selectedForm.value) {
      <button
        pdz-button
        iconOnly
        variant="ghost"
        color="neutral"
        type="button"
        matSuffix
        (click)="clearSelection($event)"
      >
        <pdz-icon name="close_small"></pdz-icon>
      </button>
    }

    @if (selectedForm.hasError("illegal")) {
      <span pdz-error>Pokemon is <strong>illegal</strong></span>
    }
  </label>
</form>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="trigger"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayOffsetY]="-24"
  [cdkConnectedOverlayWidth]="pokemonForm.clientWidth"
  cdkConnectedOverlayBackdropClass="cdk-overlay-transparent-backdrop"
  (backdropClick)="setOpen(false)"
  [cdkConnectedOverlayOpen]="isOpen"
  (detach)="setOpen(false)"
>
  <cdk-virtual-scroll-viewport
    itemSize="48"
    minBufferPx="240"
    maxBufferPx="400"
    class="pokemon-viewport"
    #virtualScroll
  >
    <div
      *cdkVirtualFor="
        let option of filteredOptions;
        let i = index;
        trackBy: trackByFn
      "
      class="pokemon-item"
      [ngClass]="{
        'highlighted-option': highlightedIndex === i,
      }"
      (click)="selectOption(option)"
    >
      <div class="sprite-wrapper">
        <pdz-sprite flipped [pokemon]="option"></pdz-sprite>
      </div>
      <div class="pokemon-text">
        {{ option.name }}
      </div>
    </div>
  </cdk-virtual-scroll-viewport>
</ng-template>
