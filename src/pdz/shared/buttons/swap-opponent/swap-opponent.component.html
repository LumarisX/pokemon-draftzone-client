<button
  pdz-button
  iconOnly
  variant="ghost"
  color="neutral"
  [attr.aria-pressed]="showingOpponent()"
  [attr.aria-label]="showingOpponent() ? 'Show your team' : 'Show the opponent'"
  (click)="toggleOpponent()"
>
  <pdz-icon
    name="cycle"
    class="swap-icon"
    [class.swap-icon--flipped]="showingOpponent()"
  />
</button>
