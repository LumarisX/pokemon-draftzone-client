<section class="match">
  @for (side of sides; track side; let first = $first) {
    <div
      class="match__side"
      [class.match__side--end]="!first"
      [attr.data-accent]="accents[side]"
    >
      <div class="match__side-head">
        <span class="match__name">{{ teamName(side) }}</span>
        <input
          pdz-input
          size="sm"
          class="match__score-input"
          type="number"
          min="0"
          inputmode="numeric"
          [formControl]="scoreControl(side)"
          [attr.aria-label]="teamName(side) + ' match score'"
          (input)="onScoreInput($event)"
          (blur)="onScoreBlur(side)"
        />
        <button
          pdz-button
          size="sm"
          type="button"
          class="match__forfeit"
          [color]="hasForfeited(side) ? 'danger' : 'neutral'"
          [variant]="hasForfeited(side) ? 'filled' : 'outlined'"
          [attr.aria-pressed]="hasForfeited(side)"
          [attr.aria-label]="teamName(side) + ' forfeited'"
          (click)="onForfeit(side)"
        >
          Forfeit
        </button>
      </div>
    </div>
  }

  @for (side of sides; track side; let first = $first) {
    <input
      pdz-input
      size="sm"
      class="match__paste"
      [attr.data-accent]="accents[side]"
      [class.match__paste--end]="!first"
      type="url"
      spellcheck="false"
      placeholder="Team link"
      [formControl]="pasteControl(side)"
      [attr.aria-label]="teamName(side) + ' team link'"
    />

    @if (first) {
      <div class="match__winner-cell">
        <pdz-select
          class="match__winner"
          size="sm"
          placeholder="Undecided"
          aria-label="Match winner"
          [attr.data-winner]="winner()"
          [disabled]="isForfeit()"
          [value]="winner()"
          (valueChange)="onWinner($any($event))"
        >
          @for (option of sides; track option) {
            <pdz-option [value]="option" [label]="teamName(option)" />
          }
        </pdz-select>
        @if (forfeitCaption(); as caption) {
          <span class="match__winner-caption">{{ caption }}</span>
        }
      </div>
    }
  }

  @if (notes(); as reason) {
    <label class="match__notes">
      <span class="match__notes-label">{{ notesText() }}</span>
      <textarea
        pdz-input
        class="match__notes-input"
        rows="2"
        maxlength="500"
        [formControl]="reason"
        [placeholder]="notesHint()"
        [attr.aria-invalid]="reasonMissing()"
      ></textarea>
      @if (reasonMissing()) {
        <span class="match__notes-error">
          A forfeit needs an explanation before it can be sent.
        </span>
      }
    </label>
  }
</section>
