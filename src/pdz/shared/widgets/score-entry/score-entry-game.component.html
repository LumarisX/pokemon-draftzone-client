<pdz-disclosure
  class="game"
  tone="panel"
  [trailingGrow]="true"
  [heading]="label()"
  [attr.data-team]="teamSlot(winner())"
  [(open)]="open"
>
  <div pdz-disclosure-trailing class="game__controls">
    <div class="game__replay">
      <input
        pdz-input
        size="sm"
        class="game__replay-input"
        type="url"
        spellcheck="false"
        placeholder="Replay link"
        aria-label="Replay link"
        [formControl]="game().controls.link"
      />
      @if (canAnalyze()) {
        <button
          pdz-button
          iconOnly
          size="xs"
          variant="ghost"
          class="game__replay-action"
          aria-label="Fill stats from the replay"
          [icon]="analyzing() ? 'hourglass_top' : 'auto_fix_high'"
          (click)="analyze.emit()"
        ></button>
      }
    </div>

    <div class="game__winner-cell">
      <pdz-select
        class="game__winner"
        size="sm"
        placeholder="Undecided"
        aria-label="Game winner"
        [attr.data-team]="teamSlot(winner())"
        [value]="winner()"
        (valueChange)="onWinner($any($event))"
      >
        @for (side of order(); track side) {
          <pdz-option [value]="side" [label]="teamName(side)" />
        }
      </pdz-select>
    </div>

    @if (removable()) {
      <button
        pdz-button
        iconOnly
        icon="close"
        size="sm"
        variant="ghost"
        color="danger"
        aria-label="Remove game"
        (click)="remove.emit()"
      ></button>
    }
  </div>

  <div class="game__body">
    <div class="game__rosters">
      @for (side of order(); track side; let first = $first) {
        <pdz-score-entry-roster
          [game]="game()"
          [side]="side"
          [teamName]="teamName(side)"
          [pokedex]="pokedex()"
          [team]="first ? 'team1' : 'team2'"
        />
      }
    </div>
  </div>
</pdz-disclosure>
