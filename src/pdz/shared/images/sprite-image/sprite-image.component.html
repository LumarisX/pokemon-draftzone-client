<div class="sprite-container" [style.width]="size()" [style.height]="size()">
  @if (pokemon().id) {
    <img
      [pdzTooltip]="tooltipPosition() ? pokemonName : ''"
      [pdzTooltipPosition]="tooltipPosition() ?? 'above'"
      [ngClass]="classes"
      [src]="path"
      [alt]="pokemonName + ' sprite'"
      loading="lazy"
      (error)="fallback()"
      (load)="onSpriteLoaded()"
    />
  }
</div>
