<div
  class="forme-stack"
  [class.interactive]="isInteractive()"
  [style.width]="size()"
  [style.height]="size()"
  [attr.role]="isInteractive() ? 'button' : null"
  [attr.tabindex]="isInteractive() ? 0 : null"
  [attr.aria-label]="isInteractive() ? ariaLabel() : null"
  (keydown)="onKeydown($event)"
  (contextmenu)="onContextMenu($event)"
>
  @for (slot of slots(); track slot.index) {
    <div
      class="forme-slot"
      [class.active]="slot.isActive"
      [class.silhouette]="!slot.isActive"
      [class.hidden-slot]="!slot.visible"
      [style.transform]="slot.transform"
      [style.zIndex]="slot.zIndex"
      [attr.aria-hidden]="slot.isActive ? null : 'true'"
      [pdzTooltip]="slot.isActive ? '' : slot.pokemon.name"
      (click)="onSlotClick(slot)"
    >
      <pdz-sprite-image
        [pokemon]="slot.pokemon"
        size="100%"
        [flipped]="flipped()"
        [disabled]="disabled()"
        [tooltipPosition]="slot.isActive ? tooltipPosition() : null"
        (loadedEvent)="onSlotLoaded(slot)"
      ></pdz-sprite-image>
    </div>
  }
</div>
