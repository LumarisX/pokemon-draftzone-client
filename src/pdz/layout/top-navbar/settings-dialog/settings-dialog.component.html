<form [formGroup]="settingsForm" (ngSubmit)="save()">
  <div class="settings-dialog__body">
    <div pdz-field label="Light / Dark">
      <pdz-segmented formControlName="ldMode" aria-label="Light / Dark">
        <pdz-segmented-option value="device" label="Device" />
        <pdz-segmented-option value="light" label="Light" />
        <pdz-segmented-option value="dark" label="Dark" />
      </pdz-segmented>
    </div>

    <div pdz-field label="Theme">
      <div class="theme-grid" role="radiogroup" aria-label="Theme">
        @for (theme of themes; track theme.id) {
          <button
            type="button"
            role="radio"
            class="theme-tile"
            [ngClass]="theme.id"
            [class.theme-tile--selected]="
              settingsForm.controls.theme.value === theme.id
            "
            [attr.aria-checked]="settingsForm.controls.theme.value === theme.id"
            (click)="selectTheme(theme.id)"
          >
            <span class="theme-tile__label">{{ theme.name }}</span>
            @if (theme.id === "shiny") {
              <pdz-icon name="lock_open" [size]="16" aria-hidden="true" />
            }
          </button>
        }
      </div>
    </div>

    <div class="sprite-option">
      <div class="sprite-form">
        <label pdz-field label="Sprite Set">
          <pdz-select formControlName="spriteSet" aria-label="Sprite set">
            @for (spriteSet of spriteSets; track spriteSet.id) {
              <pdz-option [value]="spriteSet.id" [label]="spriteSet.name" />
            }
          </pdz-select>
        </label>

        <a
          target="_blank"
          pdz-button
          variant="link"
          color="neutral"
          size="sm"
          rel="noopener noreferrer"
          [href]="getCreditLink()"
          >Credits</a
        >
      </div>

      <div class="sprite-wrapper">
        <pdz-sprite [pokemon]="example" />
      </div>
    </div>

    @if (saveError()) {
      <p class="save-error" aria-live="polite">{{ saveError() }}</p>
    }
  </div>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      variant="outlined"
      color="neutral"
      [disabled]="saving()"
      (click)="ref.close()"
    >
      Cancel
    </button>
    <button pdz-button type="submit" [disabled]="saving()">
      {{ saving() ? "Saving…" : "Save" }}
    </button>
  </div>
</form>
