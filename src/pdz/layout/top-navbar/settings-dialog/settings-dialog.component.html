<form [formGroup]="settingsForm" (ngSubmit)="save()">
  <div class="settings-dialog__body">
    <div pdz-field label="Light / Dark">
      <pdz-segmented formControlName="ldMode" aria-label="Light or dark mode">
        <pdz-segmented-option value="device" label="Device" />
        <pdz-segmented-option value="light" label="Light" />
        <pdz-segmented-option value="dark" label="Dark" />
      </pdz-segmented>
    </div>

    <div pdz-field label="Theme">
      <div class="theme-grid" role="radiogroup" aria-label="Theme">
        @for (option of themes; track option.id) {
          <button
            pdz-card
            padding="sm"
            role="radio"
            class="theme-tile"
            [selected]="theme() === option.id"
            [attr.aria-checked]="theme() === option.id"
            (click)="selectTheme(option.id)"
          >
            <span class="theme-tile__inner">
              <span class="theme-tile__swatches" aria-hidden="true">
                <span
                  class="theme-tile__swatch"
                  [style.background]="swatch(option.team1)"
                ></span>
                <span
                  class="theme-tile__swatch"
                  [style.background]="swatch(option.team2)"
                ></span>
              </span>
              <span class="theme-tile__label">{{ option.name }}</span>
              @if (option.id === "shiny") {
                <pdz-icon name="lock_open" [size]="16" />
              }
            </span>
          </button>
        }
      </div>
    </div>

    <div class="sprite-option">
      <div class="sprite-form">
        <label pdz-field label="Sprite Set">
          <pdz-select formControlName="spriteSet" aria-label="Sprite Set">
            @for (set of spriteSets; track set.id) {
              <pdz-option [value]="set.id" [label]="set.name" />
            }
          </pdz-select>
        </label>

        <a
          pdz-button
          variant="link"
          color="neutral"
          size="sm"
          target="_blank"
          rel="noopener noreferrer"
          [href]="creditLink()"
          >Credits</a
        >
      </div>

      <div class="sprite-wrapper">
        <pdz-sprite [pokemon]="example" />
      </div>
    </div>

    @if (saveError()) {
      <p class="save-error" role="alert">{{ saveError() }}</p>
    }
  </div>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      variant="outlined"
      color="neutral"
      [disabled]="saving()"
      (click)="ref.close()"
    >
      Cancel
    </button>
    <button pdz-button type="submit" [loading]="saving()">Save</button>
  </div>
</form>
