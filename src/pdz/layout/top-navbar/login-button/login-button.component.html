@if (authenticated()) {
  <pdz-menu aria-label="Open user menu">
    <button pdz-button color="neutral" variant="outlined" pdz-menu-trigger>
      <span class="user">
        <pdz-icon name="account_circle" [size]="20" aria-hidden="true" />
        @if (me()?.displayName; as displayName) {
          <span class="user__name">{{ displayName }}</span>
        }
      </span>
    </button>

    <a pdz-menu-item icon="settings" [routerLink]="settingsLink">Settings</a>

    <button pdz-menu-item icon="logout" (click)="logout()">Log Out</button>
  </pdz-menu>
} @else {
  <button
    pdz-button
    color="neutral"
    variant="outlined"
    icon="login"
    (click)="login()"
  >
    Log In
  </button>
}
