@if (authenticated() && user(); as user) {
  <pdz-menu aria-label="Open user menu">
    <button pdz-button color="neutral" variant="outlined" pdz-menu-trigger>
      <span class="user">
        <pdz-team-logo
          size="xs"
          shape="circle"
          decorative
          [src]="user.picture"
          [name]="user.username || user.name || ''"
        />
        @if (user.username) {
          <span class="user__name">{{ user.username }}</span>
        }
      </span>
    </button>

    <button pdz-menu-item icon="settings" (click)="openSettings()">
      Settings
    </button>

    <button pdz-menu-item icon="logout" (click)="logout()">Log Out</button>
  </pdz-menu>
} @else {
  <button
    pdz-button
    color="neutral"
    variant="outlined"
    icon="login"
    (click)="login()"
  >
    Log In
  </button>
}
