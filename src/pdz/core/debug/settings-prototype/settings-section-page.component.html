<pdz-page width="default">
  <div class="section-page">
    <pdz-page-header
      [title]="section().label"
      [subtitle]="section().blurb"
      backLink=".."
      backLabel="Manage"
    />

    <pdz-risk-banner [risk]="risk()" />

    <pdz-card padding="lg">
      @for (node of nodes(); track node.id) {
        <pdz-settings-node [node]="node" [artifact]="node.artifact ?? null" />
      }
    </pdz-card>

    <pdz-save-bar
      [count]="dirty()"
      [blocked]="blocked()"
      [label]="'Save ' + section().label"
      (save)="save()"
      (revert)="revert()"
    />
  </div>
</pdz-page>
