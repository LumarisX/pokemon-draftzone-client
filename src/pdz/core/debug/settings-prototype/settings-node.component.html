<div class="node" [class.node--locked]="locked()" [id]="node().id">
  <div class="node__head">
    <h3 class="node__title">{{ node().title }}</h3>
    @if (dirty()) {
      <span class="node__dot" aria-label="Unsaved"></span>
    }
  </div>

  @if (node().help; as help) {
    <p class="node__help">{{ help }}</p>
  }

  @if (node().artifact; as artifact) {
    <pdz-artifact-card [slot]="artifact" [locked]="locked()" />
  }

  <div class="node__controls">
    @for (control of controls(); track $index) {
      <pdz-node-control [spec]="control" [disabled]="locked()" />
    }
  </div>

  @if (error(); as message) {
    <p class="node__error">
      <pdz-icon name="error" [size]="16" aria-hidden="true" />
      {{ message }}
    </p>
  }
</div>
