<pdz-page width="default">
  <div class="signup-page">
    <pdz-page-header
      title="Sign-Ups"
      subtitle="Who can join, by when, and who you let in."
      backLink=".."
      backLabel="Manage"
    />

    <pdz-risk-banner [risk]="risk()" />

    <pdz-card padding="lg">
      @for (node of rules(); track node.id) {
        <pdz-settings-node [node]="node" />
      }
    </pdz-card>

    <section class="applicants" id="applicants">
      <div class="applicants__head">
        <h2 class="applicants__title">Applicants</h2>
        <p class="applicants__blurb">
          {{ counts().approved }} approved · {{ counts().pending }} pending ·
          {{ counts().denied }} denied · {{ counts().dropped }} dropped.
          Approved teams become draftable — which pool they land in is set on
          the draft page.
        </p>
      </div>

      <pdz-card padding="lg">
        <pdz-applicants-panel />
      </pdz-card>
    </section>

    <pdz-save-bar
      [count]="dirty()"
      [blocked]="blocked()"
      label="Save sign-ups"
      (save)="save()"
      (revert)="revert()"
    />
  </div>
</pdz-page>
