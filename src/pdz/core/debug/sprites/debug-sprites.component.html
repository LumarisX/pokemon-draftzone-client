<pdz-page>
  <input pdz-checkbox #shiny />
  Shiny
  <div class="sprite-grid">
    @for (pokemon of names; track pokemon) {
      <div class="sprite-grid__cell" [pdzTooltip]="pokemon.id + ' ' + sprite">
        <pdz-sprite
          [pokemon]="{
            id: pokemon.id,
            name: pokemon.name,
            shiny: shiny.checked,
          }"
          #sprite
        ></pdz-sprite>
      </div>
    }
  </div>
</pdz-page>
