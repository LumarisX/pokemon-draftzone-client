<pdz-widget label="Defensive Type Chart">
  <pdz-slide-toggle widget-options [(ngModel)]="abilities">
    Abilities
  </pdz-slide-toggle>

  <pdz-typechart-core
    [typechart]="typechart()"
    [abilities]="abilities"
    (togglePokemon)="typestats.summarize()"
  ></pdz-typechart-core>
  <pdz-typestats-core
    #typestats
    [typechart]="typechart()"
    [abilities]="abilities"
  ></pdz-typestats-core>
</pdz-widget>
