<h2 mat-dialog-title class="settings-dialog__title">
  <pdz-icon name="settings"></pdz-icon>
  Tier List Settings
</h2>

<form [formGroup]="form" (ngSubmit)="onSave()">
  <div mat-dialog-content class="settings-dialog__content">
    <label pdz-field label="Title" required class="field--full">
      <input
        pdz-input
        formControlName="name"
        placeholder="Enter tier list title"
      />
      @if (
        form.get("name")?.hasError("required") && form.get("name")?.touched
      ) {
        <span pdz-error>Title is required</span>
      }
      @if (form.get("name")?.hasError("maxlength")) {
        <span pdz-error>Title must be 100 characters or fewer</span>
      }
    </label>

    <label pdz-field label="Description" class="field--full">
      <textarea
        pdz-input
        formControlName="description"
        placeholder="Optional description for this tier list"
        rows="3"
      ></textarea>
      @if (form.get("description")?.hasError("maxlength")) {
        <span pdz-error>Description must be 500 characters or fewer</span>
      }
    </label>

    <div class="settings-dialog__group-label">Draft Count</div>
    <div class="settings-dialog__row" formGroupName="draftCount">
      <label pdz-field label="Min Picks" class="field--half">
        <input
          pdz-input
          type="number"
          formControlName="min"
          placeholder="e.g. 10"
        />
        @if (form.get("draftCount")?.get("min")?.hasError("min")) {
          <span pdz-error>Must be 0 or more</span>
        }
      </label>

      <label pdz-field label="Max Picks" class="field--half">
        <input
          pdz-input
          type="number"
          formControlName="max"
          placeholder="e.g. 15"
        />
        @if (form.get("draftCount")?.get("max")?.hasError("min")) {
          <span pdz-error>Must be at least 1</span>
        }
      </label>
    </div>
    @if (
      form.get("draftCount")?.hasError("draftCountInvalid") &&
      form.get("draftCount")?.touched
    ) {
      <p class="settings-dialog__error">Min picks cannot exceed max picks</p>
    }

    @if (saveError()) {
      <p class="settings-dialog__error">{{ saveError() }}</p>
    }
  </div>

  <div mat-dialog-actions align="end" class="settings-dialog__actions">
    <button
      pdz-button
      variant="ghost"
      color="neutral"
      type="button"
      (click)="onCancel()"
      [disabled]="isSaving()"
    >
      Cancel
    </button>
    <button pdz-button type="submit" [disabled]="form.invalid || isSaving()">
      @if (isSaving()) {
        <mat-progress-spinner
          diameter="16"
          mode="indeterminate"
        ></mat-progress-spinner>
      } @else {
        Save
      }
    </button>
  </div>
</form>
