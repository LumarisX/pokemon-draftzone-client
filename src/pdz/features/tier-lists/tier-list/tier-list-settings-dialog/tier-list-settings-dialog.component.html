<form [formGroup]="form" (ngSubmit)="onSave()">
  <div class="settings-dialog__content">
    <label pdz-field label="Title" required class="field--full">
      <input
        pdz-input
        formControlName="name"
        placeholder="Enter tier list title"
      />
      @if (
        form.controls.name.touched && form.controls.name.hasError("required")
      ) {
        <span pdz-error>Title is required</span>
      }
      @if (form.controls.name.hasError("maxlength")) {
        <span pdz-error>Title must be 100 characters or fewer</span>
      }
    </label>

    <label pdz-field label="Description" class="field--full">
      <textarea
        pdz-input
        formControlName="description"
        placeholder="Optional description for this tier list"
        rows="3"
      ></textarea>
      @if (form.controls.description.hasError("maxlength")) {
        <span pdz-error>Description must be 500 characters or fewer</span>
      }
    </label>

    @if (saveError()) {
      <p class="settings-dialog__error" role="alert">{{ saveError() }}</p>
    }
  </div>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      variant="outlined"
      color="neutral"
      type="button"
      (click)="ref.close()"
      [disabled]="isSaving()"
    >
      Cancel
    </button>
    <button
      pdz-button
      type="submit"
      [loading]="isSaving()"
      [disabled]="form.invalid"
    >
      Save
    </button>
  </div>
</form>
