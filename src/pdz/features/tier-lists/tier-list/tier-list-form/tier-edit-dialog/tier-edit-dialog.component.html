<h1 mat-dialog-title>{{ isAddMode ? "Add New Tier" : "Edit Tier" }}</h1>
<form [formGroup]="form" (ngSubmit)="onSave()">
  <div mat-dialog-content class="dialog-layout">
    <div class="details-container">
      <label pdz-field label="Tier Name" required class="form-field-full-width">
        <input pdz-input formControlName="name" placeholder="e.g. S, A, B" />
        @if (
          form.get("name")?.hasError("required") && form.get("name")?.touched
        ) {
          <span pdz-error>Tier name is required</span>
        }
        @if (form.get("name")?.hasError("maxlength")) {
          <span pdz-error>Tier name cannot exceed 30 characters</span>
        }
      </label>
      <label pdz-field label="Cost (Points)" required class="form-field-full-width">
        <input type="number" pdz-input formControlName="cost" />
        @if (
          form.get("cost")?.hasError("required") && form.get("cost")?.touched
        ) {
          <span pdz-error>Required</span>
        }
      </label>
    </div>
  </div>
  <div mat-dialog-actions align="end">
    <button pdz-button variant="ghost" color="neutral" type="button" (click)="closeDialog()">Cancel</button>
    <button pdz-button
      type="submit"
      [disabled]="form.invalid"
    >
      {{ isAddMode ? "Add Tier" : "Save Changes" }}
    </button>
  </div>
</form>
