<pdz-widget label="Notes" padding="none">
  @if (mode() !== "view-only") {
    <button
      pdz-button
      iconOnly
      widget-options
      variant="ghost"
      color="neutral"
      size="sm"
      [attr.aria-label]="previewMode ? 'Edit notes' : 'Preview notes'"
      [pdzTooltip]="previewMode ? 'Edit notes' : 'Preview notes'"
      (click)="previewMode = !previewMode"
    >
      <pdz-icon [name]="previewMode ? 'edit_note' : 'preview'"></pdz-icon>
    </button>
  }

  <div class="notes-body" [class.notes-body--preview]="isPreview()">
    @if (isPreview()) {
      <markdown [data]="notes()"></markdown>
    } @else {
      <textarea
        [ngModel]="notes()"
        (ngModelChange)="onNotesChange($event)"
      ></textarea>
    }
  </div>
</pdz-widget>
