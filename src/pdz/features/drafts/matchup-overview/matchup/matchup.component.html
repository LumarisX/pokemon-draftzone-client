@if (matchupData()) {
  <div class="matchup-container">
    <pdz-overview [teams]="matchupData().summary" />
    <pdz-summary [summaries]="matchupData().summary" style="list-style: none" />
    <pdz-speedchart
      [speedchart]="matchupData().speedchart"
      [level]="matchupData().details.level"
    />
    <pdz-typechart [typecharts]="matchupData().typechart" />
    <pdz-movechart [teams]="matchupData().movechart" />
    <pdz-coveragechart
      [coverage]="matchupData().coveragechart"
      [typecharts]="matchupData().typechart"
    />
    @let matchupNotes = matchupData().notes;
    @let notesMatchupId = matchupId();
    @if (matchupNotes !== undefined && notesMatchupId) {
      <pdz-matchup-notes
        [notes]="matchupNotes"
        [mode]="options().notes"
        [matchupId]="notesMatchupId"
      />
    }
  </div>
}
<!-- {{ matchupData.overview | json }} -->
