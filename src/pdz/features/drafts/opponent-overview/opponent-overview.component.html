<div class="opponent-main">
  @if (draft(); as draft) {
    <pdz-page-header
      compact
      class="opponent-main__header"
      backLabel="My Drafts"
      [title]="draft.teamName"
      [backLink]="backLink"
    >
      <div pdz-page-header-center class="draft-bar" aria-label="Your team">
        @for (pokemon of draft.team; track $index) {
          <pdz-sprite
            grounded
            [pokemon]="pokemon"
            [class.unresolved-sprite]="pokemon.unresolved"
          />
        }
      </div>
      <span pdz-page-header-detail class="opponent-main__facts">
        <span>{{ draft.leagueName }}</span>
        <span>{{ draft.format }}</span>
        <span>{{ draft.ruleset }}</span>
      </span>
      @if (draft.score) {
        <span pdz-page-header-meta class="opponent-main__record">
          <pdz-record
            size="sm"
            [wins]="draft.score.wins"
            [losses]="draft.score.losses"
          />
          <span class="opponent-main__diff">{{ draft.score.diff }}</span>
        </span>
      }
      <div pdz-page-header-actions class="opponent-main__actions">
        <a
          pdz-button
          iconOnly
          icon="edit"
          variant="outlined"
          color="neutral"
          aria-label="Edit draft"
          pdzTooltip="Edit draft"
          routerLink="../edit"
          [queryParams]="{ draft: draftParam(draft.slug) }"
        ></a>
        @if (draft.doc) {
          <a
            pdz-button
            iconOnly
            icon="dataset_linked"
            variant="outlined"
            color="neutral"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Open league document"
            pdzTooltip="Open league document"
            [href]="draft.doc"
          ></a>
        }
      </div>
    </pdz-page-header>
  }
  <router-outlet pdzRouteEnter />
</div>
