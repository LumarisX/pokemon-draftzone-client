@if (opponentForm) {
  <div class="draft-builder">
    <header class="draft-builder__header">
      <pdz-page-header
        compact
        class="draft-builder__header-inner"
        backLabel="Back to Draft"
        [title]="title()"
        [backLink]="['/', draftPath, teamId]"
      >
        <button
          pdz-page-header-actions
          pdz-button
          [disabled]="isImporting"
          (click)="onSubmit()"
        >
          {{ submitLabel() }}
        </button>
      </pdz-page-header>
    </header>

    <div class="draft-builder__body">
      <aside class="draft-builder__panel draft-builder__panel--details">
        <h2 class="draft-builder__panel-title">Opponent Details</h2>
        <form
          class="draft-builder__form"
          [formGroup]="opponentForm.controls.details"
          (ngSubmit)="onSubmit()"
        >
          <label pdz-field class="form-field" label="Team Name">
            <input
              id="opponent-team-name"
              pdz-input
              type="text"
              spellcheck="false"
              formControlName="teamName"
            />
            @if (showError(teamNameControl, "required")) {
              <span pdz-error>Team name is required</span>
            }
          </label>

          <label pdz-field class="form-field" label="Coach Name">
            <input
              id="opponent-coach"
              pdz-input
              type="text"
              spellcheck="false"
              formControlName="coach"
            />
          </label>

          <label pdz-field class="form-field" label="Stage">
            <input
              id="opponent-stage"
              pdz-input
              type="text"
              spellcheck="false"
              formControlName="stage"
            />
            @if (showError(stageControl, "required")) {
              <span pdz-error>Stage is required</span>
            }
          </label>

          <div pdz-field class="form-field" label="Match Time">
            @if (scheduledLabel(); as when) {
              <div class="match-time">
                <div class="match-time__value">
                  <span class="match-time__when">{{ when }}</span>
                  <pdz-countdown [target]="scheduledDate()" />
                </div>
                <div class="match-time__actions">
                  <button
                    pdz-button
                    type="button"
                    size="sm"
                    variant="ghost"
                    color="neutral"
                    (click)="editMatchTime()"
                  >
                    Change
                  </button>
                  <button
                    pdz-button
                    type="button"
                    size="sm"
                    variant="ghost"
                    color="danger"
                    (click)="scheduledDate.set(null)"
                  >
                    Clear
                  </button>
                </div>
              </div>
            } @else {
              <button
                pdz-button
                type="button"
                size="sm"
                variant="outlined"
                color="neutral"
                icon="schedule"
                (click)="editMatchTime()"
              >
                Set Match Time
              </button>
            }
          </div>
        </form>
      </aside>

      <section class="draft-builder__panel draft-builder__panel--team">
        <div class="draft-builder__panel-header">
          <h2 class="draft-builder__panel-title">
            Team
            <span class="draft-builder__panel-count">{{ teamCount }}</span>
          </h2>
        </div>

        <pdz-team-editor
          [pokemonList$]="pokemonList$"
          [ruleset]="ruleset"
          [teamArray]="opponentForm.controls.team"
          (isImporting)="isImporting = $event"
        ></pdz-team-editor>
      </section>
    </div>
  </div>
}
