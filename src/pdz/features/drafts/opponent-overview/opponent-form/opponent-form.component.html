<pdz-page type="detail">
  @if (oppParams) {
    <pdz-opponent-form-core
      [title]="title"
      [submitLabel]="submitLabel"
      [params]="oppParams"
      (formSubmitted)="saveOpponent($event)"
    ></pdz-opponent-form-core>
  } @else {
    <pdz-skeleton-layout layout="form" count="6" />
  }
</pdz-page>
