<pdz-page type="detail">
@if (form && matchup) {
  <form class="score" [formGroup]="form" (ngSubmit)="submit()">
    <pdz-page-header
      compact
      backLabel="Back to Draft"
      [title]="teamName('side1') + ' vs ' + teamName('side2')"
      [backLink]="['/', draftPath, teamId]"
    >
      <button
        pdz-page-header-actions
        pdz-button
        type="submit"
        [loading]="saving()"
      >
        Save Result
      </button>
    </pdz-page-header>

    <pdz-score-entry-match
      [match]="match"
      [games]="games"
      [sideNames]="sideNames"
    />

    @if (!isForfeit()) {
      <div class="score__games">
        @for (game of gameControls; track $index) {
          <pdz-score-entry-game
            [game]="game"
            [sideNames]="sideNames"
            [pokedex]="pokedex"
            [label]="'Game ' + ($index + 1)"
            [analyzing]="analyzingIndex() === $index"
            [removable]="gameControls.length > 1"
            [open]="isGameOpen($index)"
            (openChange)="setGameOpen($index, $event)"
            (analyze)="analyze($index)"
            (remove)="removeGame($index)"
          />
        }
      </div>

      @if (analysisError()) {
        <p class="score__error">{{ analysisError() }}</p>
      }
    }
    @if (saveError()) {
      <p class="score__error">{{ saveError() }}</p>
    }

    <div class="score__footer">
      @if (!isForfeit()) {
        <button
          pdz-button
          size="sm"
          color="neutral"
          variant="outlined"
          type="button"
          (click)="addGame()"
        >
          <pdz-icon name="add" [size]="16"></pdz-icon>
          <span>Add game</span>
        </button>
      }

      <button pdz-button type="submit" [loading]="saving()">
        {{ saving() ? "Saving…" : "Submit" }}
      </button>
    </div>
  </form>
} @else {
  <pdz-skeleton-layout layout="form" />
}
</pdz-page>
