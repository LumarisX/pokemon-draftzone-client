@if (form && matchup) {
  <form class="score" [formGroup]="form" (ngSubmit)="submit()">
    <header class="score__bar">
      <button
        pdz-button
        size="sm"
        color="neutral"
        variant="outlined"
        type="button"
        [routerLink]="['/', draftPath, teamId]"
      >
        Cancel
      </button>
      <h1 class="score__title">
        {{ teamName("side1") }} vs {{ teamName("side2") }}
      </h1>
      <button pdz-button size="sm" type="submit" [loading]="saving()">
        {{ saving() ? "Saving…" : "Submit" }}
      </button>
    </header>

    <pdz-score-entry-match
      [match]="match"
      [games]="games"
      [sideNames]="sideNames"
    />

    @if (!isForfeit()) {
      <div class="score__games">
        @for (game of gameControls; track $index) {
          <pdz-score-entry-game
            [game]="game"
            [sideNames]="sideNames"
            [pokedex]="pokedex"
            [label]="'Game ' + ($index + 1)"
            [analyzing]="analyzingIndex() === $index"
            [removable]="gameControls.length > 1"
            [open]="isGameOpen($index)"
            (openChange)="setGameOpen($index, $event)"
            (analyze)="analyze($index)"
            (remove)="removeGame($index)"
          />
        }
      </div>

      @if (analysisError()) {
        <p class="score__error">{{ analysisError() }}</p>
      }
    }
    @if (saveError()) {
      <p class="score__error">{{ saveError() }}</p>
    }

    <div class="score__footer">
      @if (!isForfeit()) {
        <button
          pdz-button
          size="sm"
          color="neutral"
          variant="outlined"
          type="button"
          (click)="addGame()"
        >
          <pdz-icon name="add" [size]="16"></pdz-icon>
          <span>Add game</span>
        </button>
      }

      <button pdz-button type="submit" [loading]="saving()">
        {{ saving() ? "Saving…" : "Submit" }}
      </button>
    </div>
  </form>
} @else {
  <pdz-loading />
}
