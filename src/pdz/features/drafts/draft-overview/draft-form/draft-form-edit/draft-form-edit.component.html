<pdz-page type="detail">
  @if (draftParams) {
    <pdz-draft-form-core
      title="Edit Draft"
      submitLabel="Save Changes"
      [params]="draftParams"
      (formSubmitted)="editDraft($event)"
    ></pdz-draft-form-core>
  } @else {
    <pdz-skeleton-layout layout="form" count="6" />
  }
</pdz-page>
