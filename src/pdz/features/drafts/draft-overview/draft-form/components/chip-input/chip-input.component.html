<div class="chip-input">
  @if (label()) {
    <span class="chip-input__label">{{ label() }}</span>
  }
  <label class="chip-input__box">
    @for (chip of control().value; track $index) {
      <pdz-chip
        removable
        size="sm"
        [removeLabel]="'Remove ' + chip"
        (removed)="remove($index)"
      >
        {{ chip }}
      </pdz-chip>
    }
    <input
      #chipInput
      class="chip-input__field"
      type="text"
      spellcheck="false"
      autocomplete="off"
      [attr.aria-label]="label() || placeholder()"
      [placeholder]="control().value.length ? '' : placeholder()"
      (keydown)="handleKeydown($event, chipInput)"
      (blur)="add(chipInput)"
    />
  </label>
</div>
