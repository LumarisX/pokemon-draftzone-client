<pdz-page width="default">
  <div class="tools-page">
  <h1 class="tools-page__title">Tools</h1>
  <nav class="tools-list">
    @for (tool of tools; track tool.link) {
      <a class="tools-list__item" [routerLink]="tool.link">
        <h2 class="tools-list__label">{{ tool.title }}</h2>
      </a>
    }
  </nav>
</div>
</pdz-page>
