<pdz-page-header title="Quick Draft">
  @if (draftSettings; as settings) {
    <span pdz-page-header-detail
      >{{ settings.ruleset }} · {{ settings.format }} · Team of
      {{ getTotalPicks() }}</span
    >
  }
</pdz-page-header>
@if (draftSettings) {
  @if (finalDraft) {
    <pdz-quick-draft-final
      [draft]="finalDraft"
      [settings]="draftSettings"
      (restartDraft)="restartDraft()"
    />
  } @else {
    <pdz-quick-draft-picks
      [settings]="draftSettings"
      (finalDraft)="updateFinalDraft($event)"
    />
  }
} @else {
  <pdz-quick-draft-setting (settingsUpdated)="updateSettings($event)" />
}
