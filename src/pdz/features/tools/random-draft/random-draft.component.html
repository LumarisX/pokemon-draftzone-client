<pdz-page type="tool">
  <div class="random">
    <pdz-page-header
      title="Random Draft"
      subtitle="Roll a random team and take it into a draft or a quick matchup."
    />

    <div class="random__controls">
      <label pdz-field class="random__count" label="Team Size">
        <input
          pdz-input
          type="number"
          [min]="min"
          [max]="max"
          [value]="count()"
          (change)="setCount($any($event.target).value)"
        />
      </label>
      <button pdz-button icon="casino" [loading]="rolling()" (click)="roll()">
        Roll a Team
      </button>
    </div>

    @if (team().length) {
      <pdz-card padding="md">
        <div class="random__team">
          @for (pokemon of team(); track $index) {
            <pdz-sprite size="fill" [pokemon]="pokemon" />
          }
        </div>
      </pdz-card>

      <div class="random__actions">
        <a
          pdz-button
          variant="outlined"
          color="neutral"
          [routerLink]="newDraftLink"
          [queryParams]="teamParams()"
          >Start a New Draft</a
        >
        <a
          pdz-button
          variant="outlined"
          color="neutral"
          [routerLink]="quickMatchupLink"
          [queryParams]="teamParams()"
          >Open in Quick Matchup</a
        >
      </div>
    }
  </div>
</pdz-page>
