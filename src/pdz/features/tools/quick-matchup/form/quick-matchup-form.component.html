@if (quickForm(); as quickForm) {
  <div class="draft-builder__body">
    <aside class="draft-builder__panel draft-builder__panel--details">
      <h2 class="draft-builder__panel-title">League Details</h2>
      <form
        class="draft-builder__form"
        [formGroup]="quickForm.controls.details"
        (ngSubmit)="onSubmit()"
      >
        <pdz-format-select formControlName="format"></pdz-format-select>
        <pdz-ruleset-select formControlName="ruleset"></pdz-ruleset-select>
      </form>
    </aside>

    <section class="draft-builder__panel draft-builder__panel--team">
      <div class="draft-builder__panel-header">
        <h2 class="draft-builder__panel-title">
          Team 1
          <span class="draft-builder__panel-count">{{ side1Count }}</span>
        </h2>
      </div>

      <pdz-team-editor
        [pokemonList$]="pokemonList$"
        [ruleset]="quickForm.controls.details.controls.ruleset.value"
        [teamArray]="quickForm.controls.side1.controls.team"
        (isImporting)="isImporting = $event"
      ></pdz-team-editor>
    </section>
    <section class="draft-builder__panel draft-builder__panel--team">
      <div class="draft-builder__panel-header">
        <h2 class="draft-builder__panel-title">
          Team 2
          <span class="draft-builder__panel-count">{{ side2Count }}</span>
        </h2>
      </div>

      <pdz-team-editor
        [pokemonList$]="pokemonList$"
        [ruleset]="quickForm.controls.details.controls.ruleset.value"
        [teamArray]="quickForm.controls.side2.controls.team"
        (isImporting)="isImporting = $event"
      ></pdz-team-editor>
    </section>
  </div>
}
