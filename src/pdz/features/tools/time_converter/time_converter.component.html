<div class="converter-page">
  <section class="converter-summary">
    <h2 class="converter-summary__title">Time Converter</h2>
    <div class="converter-summary__rows">
      <p class="converter-summary__row">
        <span class="converter-summary__label">Local Time</span>
        <span class="converter-summary__value">{{
          formatDisplay("local")
        }}</span>
      </p>
      <p class="converter-summary__row">
        <span class="converter-summary__label">Opponent's Time</span>
        <span class="converter-summary__value">{{
          formatDisplay("opponent")
        }}</span>
      </p>
    </div>
    <div class="converter-stamp">
      <pdz-icon name="discord" [size]="18"></pdz-icon>
      <code class="converter-stamp__code">{{ discordTimestamp }}</code>
      <button
        pdz-button
        iconOnly
        size="sm"
        variant="ghost"
        color="neutral"
        class="converter-stamp__copy"
        [attr.aria-label]="copied ? 'Copied' : 'Copy Discord timestamp'"
        [cdkCopyToClipboard]="discordTimestamp"
        (click)="copy()"
      >
        <pdz-icon [name]="copied ? 'check' : 'content_copy'" [size]="18" />
      </button>
    </div>
  </section>

  <div class="converter-columns">
    <section class="converter-side">
      <h3 class="converter-side__title">You</h3>
      <pdz-timezone-select
        label="Local Time Zone"
        [zones]="timeZones"
        [shortZones]="timeZonesShort"
        [value]="localZone"
        (valueChange)="setZone('local', $event)"
      />
      <div class="converter-field">
        <label class="converter-field__label" for="local-date">Date</label>
        <input
          id="local-date"
          class="converter-field__input"
          type="date"
          [(ngModel)]="localDate"
          (ngModelChange)="sync('local')"
        />
      </div>
      <div class="converter-field">
        <label class="converter-field__label" for="local-time">Time</label>
        <input
          id="local-time"
          class="converter-field__input"
          type="time"
          [(ngModel)]="localTime"
          (ngModelChange)="sync('local')"
        />
      </div>
      <div class="converter-slider">
        <div class="converter-slider__icons">
          <pdz-icon name="nightlight" [size]="18" />
          <pdz-icon name="wb_twilight" [size]="18" />
          <pdz-icon name="sunny" [size]="18" />
          <pdz-icon name="wb_twilight" [size]="18" />
          <pdz-icon name="nightlight" [size]="18" />
        </div>
        <pdz-slider
          [min]="0"
          [max]="1425"
          [step]="15"
          [(ngModel)]="localMinutes"
        />
      </div>
    </section>

    <section class="converter-side">
      <h3 class="converter-side__title">Opponent</h3>
      <pdz-timezone-select
        label="Opponent Time Zone"
        [zones]="timeZones"
        [shortZones]="timeZonesShort"
        [value]="opponentZone"
        (valueChange)="setZone('opponent', $event)"
      />
      <div class="converter-field">
        <label class="converter-field__label" for="opponent-date">Date</label>
        <input
          id="opponent-date"
          class="converter-field__input"
          type="date"
          [(ngModel)]="opponentDate"
          (ngModelChange)="sync('opponent')"
        />
      </div>
      <div class="converter-field">
        <label class="converter-field__label" for="opponent-time">Time</label>
        <input
          id="opponent-time"
          class="converter-field__input"
          type="time"
          [(ngModel)]="opponentTime"
          (ngModelChange)="sync('opponent')"
        />
      </div>
      <div class="converter-slider">
        <div class="converter-slider__icons">
          <pdz-icon name="nightlight" [size]="18" />
          <pdz-icon name="wb_twilight" [size]="18" />
          <pdz-icon name="sunny" [size]="18" />
          <pdz-icon name="wb_twilight" [size]="18" />
          <pdz-icon name="nightlight" [size]="18" />
        </div>
        <pdz-slider
          [min]="0"
          [max]="1425"
          [step]="15"
          [(ngModel)]="opponentMinutes"
        />
      </div>
    </section>
  </div>
</div>
