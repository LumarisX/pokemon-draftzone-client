@if (label()) {
  <label class="timezone-select__label" [id]="selectId + '-label'">
    {{ label() }}
  </label>
}
<pdz-select
  searchable
  [showGroupInTrigger]="false"
  searchPlaceholder="Search time zones"
  placeholder="Select a time zone..."
  [aria-labelledby]="label() ? selectId + '-label' : undefined"
  [aria-label]="label() ? undefined : 'Time zone'"
  [value]="selectedKey()"
  (valueChange)="onKeyChange($event)"
>
  @for (tz of shortZones(); track tz.name + tz.short) {
    <pdz-option
      group="Abbreviated"
      [value]="key(tz)"
      [label]="tz.short ?? tz.name"
      [description]="tz.utc"
    />
  }
  @for (tz of zones(); track tz.name) {
    <pdz-option
      group="Locations"
      [value]="key(tz)"
      [label]="tz.name"
      [description]="tz.short ? tz.short + ' · ' + tz.utc : tz.utc"
    />
  }
</pdz-select>
