<pdz-page type="hub">
  <pdz-page-header
    title="Profile"
    [backLink]="dashboardLink"
    backLabel="Dashboard"
  />

  @if (failed()) {
    <pdz-empty-state
      bordered
      kind="error"
      heading="Could not load your profile"
      message="Your seasons and achievements did not come back from the server."
      retry="event"
      (retried)="load()"
    />
  } @else if (profile(); as data) {
    <pdz-profile-body [profile]="data" />
  } @else {
    <pdz-skeleton-layout layout="list" count="6" />
  }
</pdz-page>
