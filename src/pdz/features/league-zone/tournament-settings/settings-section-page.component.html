<pdz-page width="default">
  @if (store.loading()) {
    <div class="section-page__loading"><pdz-loading /></div>
  } @else {
  <div class="section-page">
    <pdz-page-header
      [title]="section().label"
      [subtitle]="section().blurb"
      backLink=".."
      backLabel="Manage"
    />

    <pdz-risk-banner [risk]="risk()" />

    <pdz-card padding="lg">
      @for (entry of nodes(); track entry.node.id) {
        <pdz-settings-node
          [node]="entry.node"
          [artifact]="entry.node.artifact ?? null"
          [disabled]="entry.locked"
          [lockedReason]="entry.locked ? gateReason : null"
        />
      }
    </pdz-card>

    <pdz-save-bar
      [count]="dirty()"
      [blocked]="blocked()"
      [pending]="store.saving()"
      [error]="store.saveError()"
      [label]="'Save ' + section().label"
      (save)="save()"
      (revert)="revert()"
    />
  </div>
  }
</pdz-page>
