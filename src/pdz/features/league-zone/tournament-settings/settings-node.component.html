<div class="node" [class.node--disabled]="disabled()" [id]="node().id">
  <div class="node__head">
    <div class="node__title-row">
      <h3 class="node__title">{{ node().title }}</h3>
      <pdz-help [label]="node().title" [text]="node().help" />
    </div>
    @if (node().hint; as hint) {
      <p class="node__hint">{{ hint }}</p>
    }
  </div>

  @if (gateReason(); as reason) {
    <p class="node__note">
      <pdz-icon name="info" [size]="16" aria-hidden="true" />
      {{ reason }}
    </p>
  } @else if (fixedNote(); as note) {
    <p class="node__note">
      <pdz-icon name="lock" [size]="16" aria-hidden="true" />
      {{ note }}
    </p>
  }

  <div class="node__controls">
    @for (control of controls(); track $index) {
      <pdz-node-control
        [spec]="control"
        [disabled]="controlDisabled(control)"
        [poolId]="poolId()"
      />
    }
  </div>

  @if (error(); as message) {
    <p class="node__error">
      <pdz-icon name="error" [size]="16" aria-hidden="true" />
      {{ message }}
    </p>
  }
</div>
