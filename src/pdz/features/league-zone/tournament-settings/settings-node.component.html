<div class="node" [class.node--disabled]="disabled()" [id]="node().id">
  <div class="node__head">
    <h3 class="node__title">{{ node().title }}</h3>
  </div>

  @if (node().help; as help) {
    <p class="node__help">{{ help }}</p>
  }

  @if (lockedReason(); as reason) {
    <p class="node__locked">
      <pdz-icon name="lock" [size]="16" aria-hidden="true" />
      {{ reason }}
    </p>
  }

  @if (artifact(); as slot) {
    <pdz-artifact-card [slot]="slot" [locked]="disabled()" />
  }

  <div class="node__controls">
    @for (control of controls(); track $index) {
      <pdz-node-control
        [spec]="control"
        [disabled]="disabled()"
        [poolId]="poolId()"
      />
    }
  </div>

  @if (error(); as message) {
    <p class="node__error">
      <pdz-icon name="error" [size]="16" aria-hidden="true" />
      {{ message }}
    </p>
  }
</div>
