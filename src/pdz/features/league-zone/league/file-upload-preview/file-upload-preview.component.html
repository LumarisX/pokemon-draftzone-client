@if (file) {
  <div class="preview-container">
    @if (isImage && previewUrl(); as url) {
      <img [src]="url" alt="File preview" class="file-preview-image" />
    } @else {
      <div class="file-preview-placeholder">
        <pdz-icon name="insert_drive_file" size="xl" aria-hidden="true" />
        <span>{{ file.type || "File" }}</span>
      </div>
    }
  </div>

  <p class="preview-meta">{{ file.name }} ({{ formatBytes(file.size) }})</p>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      type="button"
      variant="outlined"
      color="neutral"
      (click)="ref.close(false)"
    >
      Cancel
    </button>
    <button pdz-button type="button" (click)="ref.close(true)">
      Okay &amp; Upload
    </button>
  </div>
} @else {
  <p>No file data available.</p>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      type="button"
      variant="outlined"
      color="neutral"
      (click)="ref.close(false)"
    >
      Close
    </button>
  </div>
}
