@if (file) {
  <pdz-card class="preview-card" padding="sm">
    <div pdz-card-header>
      <div class="preview-card__titles">
        <span class="preview-card__title">Confirm Upload</span>
        <span class="preview-card__subtitle"
          >{{ file.name }} ({{ formatBytes(file.size) }})</span
        >
      </div>
    </div>
    <div class="preview-container">
      @if (isImage && previewUrl) {
        <img [src]="previewUrl" alt="File Preview" class="file-preview-image" />
      } @else {
        <div class="file-preview-placeholder">
          <pdz-icon name="insert_drive_file" size="xl"></pdz-icon>
          <span>{{ file.type || "File" }}</span>
        </div>
      }
    </div>
    <div pdz-card-footer class="preview-card__actions">
      <button pdz-button variant="ghost" color="neutral" (click)="onCancel()">
        Cancel
      </button>
      <button pdz-button (click)="onConfirm()">Okay & Upload</button>
    </div>
  </pdz-card>
} @else {
  <pdz-card padding="sm">
    <p>No file data available.</p>
    <div pdz-card-footer class="preview-card__actions">
      <button pdz-button variant="ghost" color="neutral" (click)="onCancel()">
        Close
      </button>
    </div>
  </pdz-card>
}
