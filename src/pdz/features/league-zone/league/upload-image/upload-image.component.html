<div>
  <input
    type="file"
    #fileInput
    hidden
    (change)="onFileSelected($event)"
    accept="image/*"
  />

  <button pdz-button (click)="openFileInput()" [disabled]="isUploading">
    <pdz-icon name="upload_file"></pdz-icon>
    Choose File
  </button>
</div>

@if (isUploading || uploadMessage) {
  <div class="upload-status">
    @if (isUploading) {
      <div
        class="upload-progress"
        role="progressbar"
        aria-label="Upload progress"
        aria-valuemin="0"
        aria-valuemax="100"
        [attr.aria-valuenow]="uploadProgress"
      >
        <div class="upload-progress__fill" [style.width.%]="uploadProgress"></div>
      </div>
      <div class="upload-progress__label">Progress: {{ uploadProgress }}%</div>
    }

    @if (uploadMessage) {
      <div
        class="status-message"
        [class.error]="uploadError"
        [class.success]="!uploadError && (confirmed || uploadProgress === 100)"
      >
        {{ uploadMessage }}
        @if (uploadedFileKey && !isUploading && confirmed) {
          <div class="file-key">Uploaded file key: {{ uploadedFileKey }}</div>
        }
      </div>
    }
  </div>
}

@if (confirmed && uploadedFileKey) {
  <div class="uploaded-image-container">
    <pdz-hosted-image [key]="uploadedFileKey"></pdz-hosted-image>
  </div>
}
