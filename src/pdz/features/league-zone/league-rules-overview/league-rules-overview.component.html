<pdz-page type="detail">
  <pdz-page-sections [sections]="sections()">
    <pdz-page-header title="Rules" />

    @if (rules(); as rules) {
      @if (rules.length) {
        @for (rule of rules; track $index) {
          <pdz-card padding="lg" [id]="sectionId($index)">
            <section
              class="rules__section"
              [attr.aria-labelledby]="sectionId($index) + '-title'"
            >
              <h2 class="rules__section-title" [id]="sectionId($index) + '-title'">
                {{ rule.title }}
              </h2>
              <markdown class="markdown-content" [data]="rule.body" />
            </section>
          </pdz-card>
        }
      } @else {
        <pdz-empty-state
          bordered
          kind="waiting"
          heading="No rules yet"
          [message]="noRulesMessage()"
        />
      }
    } @else {
      <pdz-skeleton-layout layout="text" />
    }
  </pdz-page-sections>
</pdz-page>
