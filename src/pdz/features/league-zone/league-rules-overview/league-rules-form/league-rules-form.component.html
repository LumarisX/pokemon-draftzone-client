<div class="rules-editor">
  <div class="rules-header">
    <h2>League Rule Sections</h2>
    <button pdz-button (click)="addSection()" [disabled]="isSaving()">
      + Add Section
    </button>
  </div>

  @if (saveMessage(); as message) {
    <div
      class="save-message"
      [class.success]="message.type === 'success'"
      [class.error]="message.type === 'error'"
    >
      {{ message.text }}
    </div>
  }

  <div class="sections-list">
    @for (section of rules(); track $index) {
      <div class="section-editor">
        <div class="section-header">
          <div class="section-controls">
            <button
              pdz-button
              size="sm"
              color="neutral"
              variant="ghost"
              (click)="moveUp($index)"
              [disabled]="$index === 0"
              title="Move up"
            >
              ↑
            </button>
            <button
              pdz-button
              size="sm"
              color="neutral"
              variant="ghost"
              (click)="moveDown($index)"
              [disabled]="$index === rules().length - 1"
              title="Move down"
            >
              ↓
            </button>
            <button
              pdz-button
              size="sm"
              color="danger"
              variant="ghost"
              (click)="deleteSection($index)"
              title="Delete section"
            >
              Delete
            </button>
          </div>
        </div>

        <div class="section-content">
          <label class="label">Section Title</label>
          <input
            type="text"
            class="input-title"
            [(ngModel)]="section.title"
            (change)="onRuleChange()"
            placeholder="Enter section title"
          />

          <label class="label">Section Body</label>
          <textarea
            class="textarea-body"
            [(ngModel)]="section.body"
            (change)="onRuleChange()"
            placeholder="Enter rule details here..."
          ></textarea>
        </div>
      </div>
    } @empty {
      <div class="empty-state">
        <p>No rule sections yet. Click "Add Section" to create one.</p>
      </div>
    }
  </div>

  <div class="actions-footer">
    <button
      pdz-button
      (click)="saveRules()"
      [loading]="isSaving()"
      [disabled]="!hasUnsavedChanges() || isSaving()"
    >
      {{ isSaving() ? "Saving..." : "Save Rules" }}
    </button>
    @if (hasUnsavedChanges()) {
      <span class="unsaved-indicator"> ⚠ You have unsaved changes </span>
    }
  </div>
</div>
