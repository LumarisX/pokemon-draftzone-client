<pdz-page type="form">
<pdz-page-header title="Rules" eyebrow="Manage">
  <div pdz-page-header-actions>
    <button
      pdz-button
      icon="add"
      variant="outlined"
      color="neutral"
      [disabled]="isSaving()"
      (click)="addSection()"
    >
      Add Section
    </button>
    <button
      pdz-button
      icon="save"
      [loading]="isSaving()"
      [disabled]="!hasUnsavedChanges()"
      (click)="saveRules()"
    >
      Save Rules
    </button>
  </div>
  @if (hasUnsavedChanges()) {
    <span pdz-page-header-detail class="rules-editor__dirty">Unsaved changes</span>
  }
</pdz-page-header>

@for (section of rules(); track $index) {
  <pdz-card padding="lg">
    <section class="section" [attr.aria-label]="section.title || 'Untitled section'">
      <div class="section__toolbar">
        <span class="section__index">Section {{ $index + 1 }}</span>
        <button
          pdz-button
          iconOnly
          icon="arrow_upward"
          size="sm"
          variant="ghost"
          color="neutral"
          aria-label="Move section up"
          [disabled]="$first"
          (click)="move($index, -1)"
        ></button>
        <button
          pdz-button
          iconOnly
          icon="arrow_downward"
          size="sm"
          variant="ghost"
          color="neutral"
          aria-label="Move section down"
          [disabled]="$last"
          (click)="move($index, 1)"
        ></button>
        <button
          pdz-button
          iconOnly
          icon="delete"
          size="sm"
          variant="ghost"
          color="danger"
          aria-label="Delete section"
          (click)="deleteSection($index)"
        ></button>
      </div>

      <label pdz-field label="Title">
        <input
          pdz-input
          type="text"
          placeholder="Section title"
          [value]="section.title"
          (input)="updateSection($index, { title: $any($event.target).value })"
        />
      </label>

      <label pdz-field label="Body" hint="Markdown is supported.">
        <textarea
          pdz-input
          class="section__body"
          rows="8"
          placeholder="Rule details"
          [value]="section.body"
          (input)="updateSection($index, { body: $any($event.target).value })"
        ></textarea>
      </label>
    </section>
  </pdz-card>
} @empty {
  <pdz-empty-state
    bordered
    kind="empty"
    heading="No rule sections yet"
    message="Add a section to start writing the rules."
  />
}
</pdz-page>
