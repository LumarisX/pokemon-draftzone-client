@if (drafts.length) {
  <pdz-segmented
    class="draft-switcher"
    size="sm"
    aria-label="Draft pool"
    [value]="currentDraftSlug()"
    (valueChange)="selectDraft($any($event))"
  >
    @for (draft of drafts; track draft.draftSlug) {
      <pdz-segmented-option [value]="draft.draftSlug" [label]="draft.name" />
    }
  </pdz-segmented>
}
