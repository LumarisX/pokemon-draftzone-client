@if (tradeRounds) {
  @if (withdrawError) {
    <p class="trades__error">{{ withdrawError }}</p>
  }
  @for (round of tradeRounds; track round.name) {
    <section class="round">
      <h4 class="round__name">{{ round.name }}</h4>
      <div class="round__trades">
        @for (tradeLog of round.trades; track tradeLog) {
          <pdz-trade-card
            [trade]="tradeLog"
            [currentRoundIndex]="currentRoundIndex"
          >
            <div tradeActions>
              @if (canWithdraw(tradeLog)) {
                <button
                  pdz-button
                  size="xs"
                  color="danger"
                  variant="outlined"
                  [disabled]="withdrawingTradeId === tradeLog.id"
                  (click)="withdraw(tradeLog)"
                >
                  {{
                    withdrawingTradeId === tradeLog.id
                      ? "Withdrawing…"
                      : "Withdraw"
                  }}
                </button>
              }
            </div>
          </pdz-trade-card>
        }
      </div>
    </section>
  } @empty {
    <p class="trades__empty">No trades made.</p>
  }
}
