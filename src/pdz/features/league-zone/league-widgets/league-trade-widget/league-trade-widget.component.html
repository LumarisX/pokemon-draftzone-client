@if (tradeRounds(); as rounds) {
  @if (withdrawError()) {
    <p class="trades__error" role="alert">{{ withdrawError() }}</p>
  }
  @for (round of rounds; track round.name) {
    <section class="round">
      <h3 class="round__name">{{ round.name }}</h3>
      <div class="round__trades">
        @for (tradeLog of round.trades; track tradeLog.id ?? $index) {
          <pdz-trade-card
            [trade]="tradeLog"
            [currentRoundIndex]="currentRoundIndex()"
            [viewerTeamId]="withdrawableTeamId()"
          >
            <div tradeActions>
              @if (canWithdraw(tradeLog)) {
                <button
                  pdz-button
                  size="xs"
                  color="danger"
                  variant="outlined"
                  [loading]="withdrawingTradeId() === tradeLog.id"
                  (click)="withdraw(tradeLog)"
                >
                  Withdraw
                </button>
              }
            </div>
          </pdz-trade-card>
        }
      </div>
    </section>
  } @empty {
    <pdz-empty-state icon="swap_horiz" message="No trades made." size="sm" />
  }
}
