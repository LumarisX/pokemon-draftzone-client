@if (tradeRounds) {
  @if (withdrawError) {
    <p class="stage__error">{{ withdrawError }}</p>
  }
  @for (stage of tradeRounds; track stage.name) {
    <div class="stage">
      <div class="stage-header">{{ stage.name }}</div>
      <div class="stage-body">
        @for (tradeLog of stage.trades; track tradeLog) {
          <pdz-trade-card
            [tradeLog]="tradeLog"
            [currentRoundIndex]="currentRoundIndex"
            [canWithdraw]="canWithdraw(tradeLog)"
            [withdrawing]="withdrawingTradeId === tradeLog.id"
            (withdraw)="withdraw(tradeLog)"
          ></pdz-trade-card>
        }
      </div>
    </div>
  } @empty {
    <p class="stage__empty">No trades made.</p>
  }
}
