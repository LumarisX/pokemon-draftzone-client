@if (stages.length || allStagesLabel) {
  <nav class="stage-switcher">
    @if (allStagesLabel) {
      <button
        type="button"
        class="stage-switcher__tab"
        [class.stage-switcher__tab--active]="currentStageSlug === 'all'"
        (click)="selectStage('all')"
      >
        {{ allStagesLabel }}
      </button>
    }
    @for (stage of stages; track stage.slug) {
      <button
        type="button"
        class="stage-switcher__tab"
        [class.stage-switcher__tab--active]="stage.slug === currentStageSlug"
        (click)="selectStage(stage.slug)"
      >
        {{ getStageLabel(stage) }}
      </button>
    }
  </nav>
}
