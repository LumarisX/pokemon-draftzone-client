<div class="division-header">
  <div class="division-header__meta">
    <button
      type="button"
      class="division-header__back"
      [routerLink]="['../../']"
    >
      <pdz-icon name="arrow_back" size="sm"></pdz-icon> Back
    </button>
    <div class="division-header__info">
      <h1 class="division-header__league-name">{{ leagueName }}</h1>
      <h2 class="division-header__division-name">{{ divisionName }}</h2>
    </div>
  </div>

  <img
    class="division-header__image"
    [src]="getLogoUrl(logo)"
    alt="League logo"
  />
</div>

<pdz-tab-nav align="stretch" label="Division sections">
  <a pdz-tab-link [routerLink]="['../../teams']" routerLinkActive>Teams</a>
  <a pdz-tab-link routerLink="./tier-list" routerLinkActive>Tier List</a>
  <a pdz-tab-link routerLink="./draft" routerLinkActive>Draft</a>
</pdz-tab-nav>
<pdz-stage-switcher
  [currentStageSlug]="stageSlug"
  (stageSelected)="onStageSelected($event)"
></pdz-stage-switcher>
<div class="division-body">
  <div class="section section--matchups">
    <div class="section-header">
      <h3>Matchups</h3>
    </div>
    <div class="section-body">
      @if (stageSlug) {
        <pdz-league-schedule-widget></pdz-league-schedule-widget>
      }
    </div>
  </div>
  <div class="section section--trades">
    <div class="section-header">
      <h3>Active Trades</h3>
    </div>
    <div class="section-body">
      @if (stageSlug) {
        <pdz-league-trade-widget
          [stageSlug]="stageSlug"
        ></pdz-league-trade-widget>
      }
    </div>
  </div>
