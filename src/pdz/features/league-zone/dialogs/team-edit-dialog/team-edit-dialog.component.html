<pdz-team-identity-picker
  [(value)]="identity"
  [showSaved]="data.showSaved ?? true"
/>

@if (missing()) {
  <p class="team-edit__error" role="alert">
    Pick a team, or give your custom team a name.
  </p>
}

<div class="pdz-dialog-actions">
  <button
    pdz-button
    type="button"
    variant="outlined"
    color="neutral"
    (click)="ref.close()"
  >
    Cancel
  </button>
  <button pdz-button type="button" (click)="save()">Save Changes</button>
</div>
