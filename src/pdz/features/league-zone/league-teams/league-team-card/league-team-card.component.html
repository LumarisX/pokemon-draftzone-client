@let team = teamDetails();

<a
  pdz-card
  interactive
  padding="sm"
  class="team"
  [routerLink]="['..', 'teams', team.slug]"
>
  <div pdz-card-media>
    <pdz-roster-sprites
      layout="tiers"
      [tone]="team.isCoach ? 'team1' : 'team2'"
      [pokemon]="roster()"
      [spots]="hiddenSpots()"
      [name]="team.name"
    />
  </div>

  <div class="team__body">
    <div class="team__head">
      <pdz-team
        size="row"
        [headingLevel]="headingLevel()"
        [name]="team.name"
        [logo]="logoSrc()"
        [coach]="team.coach"
      />
      @if (team.record; as record) {
        <pdz-record
          size="sm"
          [wins]="record.wins"
          [draws]="record.draws"
          [losses]="record.losses"
        />
      }
    </div>

    <div class="team__foot">
      @if (team.picksHidden) {
        <span class="team__note">
          <pdz-icon name="lock" [size]="14" aria-hidden="true" />
          {{ hiddenPicksMessage() }}
        </span>
      } @else {
        <span class="team__note">{{ team.draft.length }} Pokémon</span>
        <span class="team__points"
          >{{ totalCost() }}
          @if (team.pointTotal) {
            <span class="team__unit">of {{ team.pointTotal }}</span>
          }
          <span class="team__unit">pts</span></span
        >
      }
    </div>
  </div>
</a>
