<pdz-page type="index">
  <pdz-page-header title="Trades">
    @if (summary(); as summary) {
      <div pdz-page-header-meta class="trades__meta">
        @if (summary.currentRoundName; as roundName) {
          <pdz-chip size="sm" icon="play_arrow">{{ roundName }}</pdz-chip>
        }
        <pdz-chip size="sm" icon="sync_alt">{{ summary.total }} trades</pdz-chip>
        @if (summary.pending; as pending) {
          <pdz-chip size="sm" tone="warning" icon="schedule"
            >{{ pending }} pending</pdz-chip
          >
        }
      </div>
    }
  </pdz-page-header>

  <pdz-league-trade-widget (summaryChange)="summary.set($event)" />
</pdz-page>
