<pdz-page type="index">
  @if (leagueInfo(); as info) {
    <pdz-page-header title="Pools" [eyebrow]="info.name" />

    @if (info.pools.length) {
      <div class="pools__grid">
        @for (pool of info.pools; track pool.poolSlug) {
          <a pdz-card class="pools__pool" [routerLink]="pool.poolSlug">
            <span class="pools__name">{{ pool.name }}</span>
          </a>
        }
      </div>
    } @else {
      <pdz-empty-state
        bordered
        kind="waiting"
        heading="No pools yet"
        message="No pools have been set up for this tournament yet."
      />
    }
  } @else if (leagueInfo() === null) {
    <pdz-empty-state
      bordered
      kind="error"
      heading="Could not load this tournament"
    />
  } @else {
    <div class="loading-state">
      <pdz-loading />
    </div>
  }
</pdz-page>
