<div class="layout" [class.layout--nav-open]="navOpen()">
  <div
    class="layout__backdrop"
    aria-hidden="true"
    (click)="closeNav()"
  ></div>

  <button
    pdz-button
    iconOnly
    icon="chevron_left"
    variant="ghost"
    color="neutral"
    class="layout__nav-close"
    aria-label="Close navigation"
    (click)="closeNav()"
  ></button>

  <pdz-tournament-nav class="layout__nav"></pdz-tournament-nav>

  <main class="layout__main">
    <router-outlet pdzRouteEnter></router-outlet>
  </main>
</div>
