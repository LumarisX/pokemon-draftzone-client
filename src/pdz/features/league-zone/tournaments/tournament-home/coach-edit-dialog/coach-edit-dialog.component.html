<form [formGroup]="form" (ngSubmit)="onSave()">
  <div class="dialog-body">
    <label pdz-field label="Display Name" required>
      <input pdz-input placeholder="Deoxys" formControlName="name" />
      @if (form.controls.name.touched && form.controls.name.invalid) {
        <span pdz-error>Required</span>
      }
    </label>

    <label pdz-field label="Showdown Name" required>
      <input pdz-input placeholder="Deoxys-II" formControlName="gameName" />
      @if (form.controls.gameName.touched && form.controls.gameName.invalid) {
        <span pdz-error>Required</span>
      }
    </label>

    <label pdz-field label="Discord Username" required>
      <input
        pdz-input
        placeholder="Deoxys#0386"
        formControlName="discordName"
      />
      @if (
        form.controls.discordName.touched && form.controls.discordName.invalid
      ) {
        <span pdz-error>Required</span>
      }
    </label>

    <label pdz-field label="Time Zone" required>
      <select pdz-input formControlName="timezone">
        <option value="" disabled>Select a timezone</option>
        @for (tz of timezones; track tz) {
          <option [value]="tz">{{ tz }}</option>
        }
      </select>
      @if (form.controls.timezone.touched && form.controls.timezone.invalid) {
        <span pdz-error>Required</span>
      }
    </label>
  </div>

  <div class="pdz-dialog-actions">
    <button
      pdz-button
      type="button"
      variant="outlined"
      color="neutral"
      (click)="ref.close()"
    >
      Cancel
    </button>
    <button pdz-button type="submit">Save Changes</button>
  </div>
</form>
