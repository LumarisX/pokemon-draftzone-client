<div class="standings">
  <div class="standings__header">
    <h1 class="standings__title">Standings</h1>
  </div>

  <div class="standings__body">
    @if (isLoading) {
      <pdz-loading></pdz-loading>
    } @else if (error) {
      <p class="standings__empty standings__empty--error">{{ error }}</p>
    } @else {
      <div class="standings__table">
        @if (filters.length > 1) {
          <pdz-stage-switcher
            allStagesLabel="All Stages"
            [currentStageSlug]="teamFilter"
            (stageSelected)="teamFilter = $event"
          ></pdz-stage-switcher>
        }
        @if (teamStandings) {
          <pdz-team-standings [standingData]="teamStandings"></pdz-team-standings>
        }
      </div>

      <div class="standings__table">
        @if (filters.length > 1) {
          <pdz-stage-switcher
            allStagesLabel="All Stages"
            [currentStageSlug]="pokemonFilter"
            (stageSelected)="pokemonFilter = $event"
          ></pdz-stage-switcher>
        }
        @if (pokemonStandings.length) {
          <pdz-pokemon-standings
            [standingData]="pokemonStandings"
          ></pdz-pokemon-standings>
        } @else {
          <p class="standings__empty">No pokemon standings available.</p>
        }
      </div>
    }
  </div>
</div>
