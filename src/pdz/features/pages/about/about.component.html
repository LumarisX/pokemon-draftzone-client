<pdz-page width="default">
  <div class="about">
    <pdz-page-header
      title="About DraftZone"
      subtitle="Clear, useful data about your draft and your opponents, so you can plan and win your matches."
    />

    @for (feature of features; track feature.id; let odd = $odd) {
      <div class="feature" [class.feature--reverse]="odd">
        <pdz-card padding="lg" class="feature__card">
          <section
            class="feature__body"
            [attr.aria-labelledby]="'about-' + feature.id"
          >
            <h2 class="feature__heading" [id]="'about-' + feature.id">
              {{ feature.heading }}
            </h2>
            <p class="feature__intro">
              {{ feature.intro }}
              @if (feature.plannerLink) {
                Open the
                <a class="feature__link" [routerLink]="plannerLink">planner</a>
                to get started.
              }
            </p>
            <dl class="feature__list">
              @for (item of feature.items; track item.term) {
                <div class="feature__item">
                  <dt>{{ item.term }}</dt>
                  <dd>{{ item.text }}</dd>
                </div>
              }
            </dl>
          </section>
        </pdz-card>
        <img
          class="feature__shot"
          loading="lazy"
          [class.feature__shot--tall]="feature.tall"
          [src]="feature.image"
          [alt]="feature.alt"
        />
      </div>
    }
  </div>
</pdz-page>
