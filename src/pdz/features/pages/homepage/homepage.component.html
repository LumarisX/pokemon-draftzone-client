<section class="hero" aria-labelledby="home-title">
  <h1 class="hero__title" id="home-title" aria-label="Pokémon DraftZone">
    <span class="hero__word hero__word--start" aria-hidden="true">Pokémon</span>
    <pdz-icon class="hero__logo" name="logo-small" [size]="64" aria-hidden="true" />
    <span class="hero__word hero__word--end" aria-hidden="true">DraftZone</span>
  </h1>
  <p class="hero__tagline">
    Plan your draft. Prep your matchups. Win your games.
  </p>
</section>

<div class="home">
  <nav class="home__actions" aria-label="DraftZone links">
    <a pdz-button icon="info" [routerLink]="['/', aboutPath]">About DraftZone</a>
    @for (link of links; track link.href) {
      <a
        pdz-button
        variant="outlined"
        color="neutral"
        target="_blank"
        rel="noopener noreferrer"
        [href]="link.href"
      >
        <pdz-icon [name]="link.icon" [fill]="!!link.fill" [size]="20" />
        {{ link.label }}
      </a>
    }
  </nav>

  <div class="panels">
    <pdz-card padding="lg" class="panel">
      <section class="panel__body" aria-labelledby="home-news">
        <h2 class="panel__title" id="home-news">News</h2>
        <pdz-news-core class="panel__content" />
      </section>
    </pdz-card>
    <pdz-card padding="lg" class="panel">
      <section class="panel__body" aria-labelledby="home-changelog">
        <h2 class="panel__title" id="home-changelog">Changelog</h2>
        <pdz-changelog-core class="panel__content" />
      </section>
    </pdz-card>
  </div>
</div>
